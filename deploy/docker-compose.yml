# deploy/docker-compose.yml — HaloStream-Deployment für halogen-flash-server
# Adaptiert von spike/halogen_ref/docker-compose.yml (Podman-Variante) für Docker:
# group_add ["video","render"] statt keep-groups.
#
# Voraussetzungen:
#   1. Checkpoint komplett: /home/sascha/models/halogen_store (hf download Output,
#      enthält Checkpoint + Quality-Sidecar + tokenizer/)
#   2. Docker installiert (docker.io + docker-compose-v2)
#
# Start:
#   cd /home/sascha/halostream/deploy
#   HALOGEN_MODELS=/home/sascha/models/halogen_store docker compose up -d
#   docker compose logs -f engine   # Load dauert Minuten, Healthcheck 20m start_period
#
# RAM-WARNUNG: Die Engine mlock't ~68 GiB Gewichte + ~28 GiB KV-Pool (~96 GiB gesamt).
# NICHT gleichzeitig mit GLM-5.3-Load-Tests oder geladenen LM-Studio-Modellen betreiben.
# Sequenz heute abend: erst GLM-First-Run, dann Halogen (siehe PLAN.md).
#
# Port 8731 ist bewusst NUR auf Loopback gebunden (API ist die einzige Kante,
# Engine-Protokoll hat kein Auth). Für LAN-Zugriff: "8731:8731" statt
# "127.0.0.1:8731:8731" — bewusst entscheiden.
services:
  engine:
    image: ghcr.io/peonist-ai/halogen-flash-server:0.6.0
    command: ["engine"]
    environment:
      # Separate netns im compose-Netz; nicht zum Host publiziert.
      HALOGEN_BIND: 0.0.0.0
      # Bewusst sonst keine Env-Overrides: das Image trägt die getunten Defaults
      # (KV-Pool, Quality-Sidecar, GEMM-Plan). Siehe docs/FLAGS.md im Ref-Repo.
    volumes:
      - ${HALOGEN_MODELS:?set HALOGEN_MODELS}:/models:ro
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt: [seccomp:unconfined]
    ipc: host
    ulimits:
      memlock: -1
    group_add: ["video", "render"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/halogen-healthcheck", "engine"]
      interval: 10s
      timeout: 35s
      retries: 3
      # 20m Load-Zeit einkaufen: Failures während start_period zählen nicht.
      start_period: 20m
    restart: unless-stopped

  api:
    image: ghcr.io/peonist-ai/halogen-flash-server:0.6.0
    command: ["api"]
    depends_on:
      engine:
        condition: service_healthy
    environment:
      HALOGEN_ENGINE: engine:8730
    volumes:
      - ${HALOGEN_MODELS:?set HALOGEN_MODELS}:/models:ro
    ports:
      - "127.0.0.1:8731:8731"   # einzige publizierte Kante, nur Loopback
    healthcheck:
      test: ["CMD", "/usr/local/bin/halogen-healthcheck", "api"]
      interval: 10s
      timeout: 35s
      retries: 3
      start_period: 2m
    restart: unless-stopped