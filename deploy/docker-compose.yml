# deploy/docker-compose.yml — HaloStream-Deployment für halogen-flash-server
# Podman-Variante (group_add keep-groups).
#
# Voraussetzungen:
#   1. Checkpoint komplett: /home/sascha/models/halogen_store (hf download Output,
#      enthält Checkpoint + Quality-Sidecar + tokenizer/)
#   2. Podman installiert
#
# Start:
#   cd /home/sascha/halostream/deploy
#   HALOGEN_MODELS=/home/sascha/models/halogen_store podman compose up -d
#   podman compose logs -f   # Load dauert ~40s, Healthcheck 20m start_period
#
# RAM-WARNUNG: Die Engine mlock't ~68 GiB Gewichte + ~7.7 GiB KV-Pool.
# Der 524288-KV-Pool-Default des Images ist auf diesem Host zu gross und wedged.
# Daher HALOGEN_KV_POOL_POSITIONS=262144 (halbe Groesse, ~7.7 GiB).
#
# WICHTIG: HALOGEN_COMPOSABLE_CONTEXT darf NICHT gesetzt werden.
# Es senkt die MTP-Draft-Acceptance massiv (DE: 32%→48%, +67% Decode).
# Benchmark 2026-09-21: ohne COMPOSABLE_CONTEXT 45.1 tok/s (EN) vs. 24.9 mit.
#
# Port 8731 ist bewusst NUR auf Loopback gebunden (API ist die einzige Kante,
# Engine-Protokoll hat kein Auth). Für LAN-Zugriff: "8731:8731" statt
# "127.0.0.1:8731:8731" — bewusst entscheiden.
services:
  halogen:
    # All-in-one (engine+api in einem Container, CMD "all").
    # Die 0.6.0 Split-Config (engine+api getrennt) war fuer docker compose,
    # podman kann all-in-one mit keep-groups einfach laufen.
    image: ghcr.io/peonist-ai/halogen-flash-server:0.12.3
    command: ["all"]
    environment:
      # KV-Pool halbiert: 524288 wedged auf diesem Host (124 GiB RAM,
      # ~68 GiB Gewichte + 47.7 GiB Lookup-Tabelle via Page-Cache).
      # 262144 = ~7.7 GiB, laeuft stabil.
      HALOGEN_KV_POOL_POSITIONS: "262144"
      HALOGEN_CACHE_DIR: /cache
      HALOGEN_VISION_TOWER: /models/qwen38-flash-next-vision.hgn
      # NICHT setzen: HALOGEN_COMPOSABLE_CONTEXT (senkt Draft-Acceptance).
      # Sonst keine Overrides — das Image trägt die getunten Defaults.
    volumes:
      - ${HALOGEN_MODELS:?set HALOGEN_MODELS}:/models:ro,rbind
      - /home/sascha/halogen_cache:/cache:rw,rbind
    devices:
      - /dev/kfd
      - /dev/dri/renderD128
    security_opt: [label=disable]
    ipc: host
    ulimits:
      memlock: -1:-1
    group_add: ["keep-groups"]
    ports:
      - "127.0.0.1:8731:8731"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8731/health"]
      interval: 10s
      timeout: 35s
      retries: 3
      start_period: 2m
    restart: unless-stopped